<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Tidak Ditemukan — Rumah Impian</title>
<meta name="robots" content="noindex">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #EDF4E2 0%, #fff 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0F483F;
    padding: 20px;
  }
  .wrap {
    text-align: center;
    max-width: 480px;
  }
  .code {
    font-size: 120px;
    font-weight: 800;
    color: #CDF187;
    text-shadow: 2px 2px 0 #0F483F;
    line-height: 1;
  }
  h1 {
    margin-top: 20px;
    font-size: 32px;
    font-weight: 700;
  }
  p {
    margin-top: 16px;
    font-size: 16px;
    line-height: 1.6;
    color: #555;
  }
  a {
    display: inline-block;
    margin-top: 28px;
    padding: 14px 32px;
    background: #0F483F;
    color: #fff;
    text-decoration: none;
    border-radius: 50px;
    font-weight: 600;
    transition: background .3s;
  }
  a:hover {
    background: #1a6655;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>Halaman Tidak Ditemukan</h1>
  <p>Maaf, halaman yang Anda cari tidak ada atau sudah dipindahkan. Silakan kembali ke beranda untuk menemukan properti impian Anda.</p>
  <a href="/">Kembali ke Beranda</a>
</div>
</body>
</html>
